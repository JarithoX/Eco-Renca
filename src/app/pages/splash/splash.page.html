<ion-content class="splash-content" [fullscreen]="true">
  <div class="splash-container">
    <!-- Logotipo con efecto de brillo pulsante en el fondo -->
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="assets/icon/logo.png" alt="EcoRenca Logo" class="splash-logo" />
    </div>

    <!-- Título y Subtítulo con degradados modernos -->
    <div class="brand-wrapper">
      <h1 class="brand-title">EcoRenca</h1>
      <p class="brand-subtitle">INACAP Sede Renca</p>
    </div>

    <!-- Spinner moderno y texto de estado de carga -->
    <div class="loader-wrapper">
      <div class="modern-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-dot"></div>
      </div>
      <span class="loading-text">Iniciando Ecosistema...</span>
    </div>
  </div>
</ion-content>
